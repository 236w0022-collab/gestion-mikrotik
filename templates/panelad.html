<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control WISP - Red Comunitaria Josefinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">🎏 Sistema de Gestión WISP de Red comunitaria josefinas</span>
        <div>
            <span class="text-white me-3">👤 <strong>{{ usuario }}</strong></span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- Formulario de Registro -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">
                ➕ Registrar Nuevo Cliente
            </div>
            <div class="card-body">
                <form id="formCliente">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" id="telefono" class="form-control" placeholder="Ej. 123456789">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">Dirección IP</label>
                            <input type="text" id="ip_estatica" class="form-control" placeholder="Ej. 192.168.88.50" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Plan de Internet</label>
                            <select id="plan_id" class="form-select" required>
                                <option value="" selected disabled>Cargando planes...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Fecha de Corte</label>
                            <input type="date" id="fecha_corte" class="form-control" required>
                        </div>
                    </div>
                    <div class="text-end mt-3">
                        <button type="submit" class="btn btn-success fw-bold px-4">Guardar y Sincronizar MikroTik</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de Clientes -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold">📋 Lista de Clientes Registrados</span>
                <span class="badge bg-secondary" id="totalClientes">0 Clientes</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>IP Estática</th>
                            <th>Plan Contratado</th>
                            <th>Fecha Corte</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes">
                        <tr>
                            <td colspan="6" class="text-center py-3">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let mapaPlanes = {};

        // 1. Cargar planes de la API e insertarlos en el desplegable (<select>)
        async function cargarPlanes() {
            try {
                const res = await fetch('/api/planes');
                const planes = await res.json();

                let selectHtml = '<option value="" selected disabled>Selecciona un plan...</option>';
                planes.forEach(p => {
                    mapaPlanes[p.id] = p.nombre;
                    selectHtml += `<option value="${p.id}">${p.nombre}</option>`;
                });

                document.getElementById('plan_id').innerHTML = selectHtml;
            } catch (err) {
                console.error("Error al cargar planes:", err);
                document.getElementById('plan_id').innerHTML = '<option value="">Error al cargar planes</option>';
            }
        }

        // 2. Cargar clientes de la base de datos
        async function cargarClientes() {
            try {
                const res = await fetch('/api/clientes');
                const clientes = await res.json();

                document.getElementById('totalClientes').textContent = `${clientes.length} Clientes`;

                let html = '';
                if (clientes.length === 0) {
                    html = '<tr><td colspan="6" class="text-center text-muted py-3">No hay clientes registrados en el sistema.</td></tr>';
                } else {
                    clientes.forEach(c => {
                        const nombrePlan = mapaPlanes[c.plan_id] || `Plan #${c.plan_id}`;
                        html += `
                            <tr>
                                <td>${c.id}</td>
                                <td><strong>${c.nombre}</strong></td>
                                <td>${c.telefono || 'N/A'}</td>
                                <td><span class="badge bg-primary">${c.ip_estatica}</span></td>
                                <td><span class="badge bg-info text-dark">${nombrePlan}</span></td>
                                <td>${c.fecha_corte}</td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('tablaClientes').innerHTML = html;
            } catch (err) {
                console.error("Error al cargar clientes:", err);
            }
        }

        // 3. Registrar un nuevo cliente al enviar el formulario
        document.getElementById('formCliente').addEventListener('submit', async(e) => {
            e.preventDefault();

            const clienteData = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                ip_estatica: document.getElementById('ip_estatica').value,
                plan_id: parseInt(document.getElementById('plan_id').value),
                fecha_corte: document.getElementById('fecha_corte').value
            };

            const response = await fetch('/api/clientes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(clienteData)
            });

            if (response.ok) {
                document.getElementById('formCliente').reset();
                await cargarClientes();
            } else {
                alert("Error al registrar cliente. Revisa los datos ingresados.");
            }
        });

        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', async() => {
            await cargarPlanes();
            await cargarClientes();
        });
    </script>
</body>

</html>
